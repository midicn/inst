name: Deploy inst site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 只装配**要给访问者的文件**：
      #    不把仓库元文件（README / .github / LICENSE）暴露成线上路径。
      #    本站是**纯静态**的 —— 页面只读本站 assets，试听用的采样音色从
      #    lib.midicn.com（带 ACAO: *）按需取，运行时不依赖任何第三方接口。
      #
      # ★ 装配采用「**以 sitemap 为清单 + 自校验**」：
      #   条目目录有两百多个，手写复制清单容易随内容增长而漏项。
      #   这里从 sitemap.xml 读全部 URL，逐个复制，再逐个断言产物存在 ——
      #   于是「新增条目忘记登记」这类错误在结构上不可能发生。
      - name: Assemble site
        run: |
          set -e
          mkdir -p _build
          cp index.html manifest.webmanifest robots.txt sitemap.xml _build/
          cp -r assets _build/assets

          python3 - <<'PY'
          import os, re, shutil, sys

          BASE = 'https://inst.midicn.com/'
          s = open('sitemap.xml', encoding='utf-8').read()
          locs = re.findall(r'<loc>([^<]+)</loc>', s)
          if not locs:
              sys.exit('::error::sitemap.xml 里没有任何 <loc> —— 拒绝装配空站点')

          copied = set()
          for loc in locs:
              if not loc.startswith(BASE):
                  sys.exit('::error::sitemap 含站外 URL：%s' % loc)
              rel = loc[len(BASE):].strip('/')
              if not rel:
                  continue                      # 首页已在上面单独复制
              src = rel
              if not os.path.isdir(src):
                  sys.exit('::error::sitemap 声明了 %s，但仓库里没有该目录' % rel)
              if src in copied:
                  continue
              copied.add(src)
              dst = os.path.join('_build', rel)
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              shutil.copytree(src, dst, dirs_exist_ok=True)

          # ── 自校验：sitemap 里每一个 URL 都必须在产物里有对应页面 ──────────
          missing = []
          for loc in locs:
              rel = loc[len(BASE):].strip('/')
              p = os.path.join('_build', rel, 'index.html') if rel else '_build/index.html'
              if not os.path.isfile(p):
                  missing.append(loc)
          if missing:
              for x in missing[:10]:
                  print('::error::装配缺页 %s' % x)
              sys.exit('装配缺页 %d 个' % len(missing))

          # ── 结构断言：PWA 与资产必须齐 ────────────────────────────────────
          for f in ('_build/manifest.webmanifest', '_build/en/manifest.webmanifest',
                    '_build/robots.txt', '_build/sitemap.xml',
                    '_build/assets/core/kb/kb.js', '_build/assets/core/base.css'):
              if not os.path.isfile(f):
                  sys.exit('::error::装配缺文件 %s' % f)

          # ── 产物卫生：内部标记 / 脚本名 / 开发说明一律不得上线 ──────────
          # 通用判据：不点名任何具体工具，只按"形态"判断
          #   · 批次号 / 开发说明        → 内部工作语
          #   · 任何 .py 文件名          → 静态站点里不该出现脚本名
          #   · 带斜杠的 kb-* / _* 路径  → 内部目录形态（不带斜杠的是 CSS 类名，会误报）
          # ⚠️ 2026-09-28 两处**收窄**：原先两条按**单字**匹配的规则过宽 ——
          #    乐器正文里的正常中文（如「同■张」开头的词、以及「示意■位」这类说法）
          #    会被判成内部标记，本站产物实测 **9 处假红**，部署会被直接拦下。
          #    现改为只认更明确的写法：判据精度 = 真问题 ÷ 报出总数，误报会淹没真报。
          # ⚠️ 同日另两处**放宽**：原编号形态只认单字母，认不出真正的泄漏形态；
          #    并补上「内部规划文档路径」一类（与脚本名同族的载体）。
          # ⚠️ 同日又一处**收紧**：裸「开工」二字在散文里完全合法（实测把 home 站的部署
          #    判失败），要拦的是工作语形态 —— 现只认「开工站 / 开工包」。
          BAD = [r'【批次', r'批次\s*M\d', r'\bM\d-[a-z][\w-]*',
                 r'首个开工站|开工站|开工包|验证内核|验证站|(?<![同这])样张(?!力)|待用户审阅',
                 r'kb-core',
                 r'\b[\w-]+\.py\b',
                 r'\bplans/[\w.\-]+\.(?:md|txt|py)\b',
                 r'\bkb-[a-z][\w-]*/',
                 r'(?:^|["\'/>\s])_[a-z][\w-]*/',
                 r'占位符|此处占位|留了占位|待补|TBD']
          rx = re.compile('|'.join(BAD))
          hits = []
          for r, _d, fs in os.walk('_build'):
              for f in fs:
                  if not f.endswith(('.html', '.xml', '.txt', '.webmanifest', '.json',
                                     '.css', '.js')):
                      continue
                  fp = os.path.join(r, f)
                  m = rx.search(open(fp, encoding='utf-8', errors='ignore').read())
                  if m:
                      hits.append('%s (%s)' % (os.path.relpath(fp, '_build'), m.group(0)))
          if hits:
              for h in hits[:10]:
                  print('::error::产物含内部标记 %s' % h)
              sys.exit('公开产物卫生检查未过：%d 处' % len(hits))

          npages = sum(1 for r, _d, fs in os.walk('_build')
                       for f in fs if f.endswith('.html'))
          print('装配完成：sitemap %d 个 URL 逐一核对存在 · 产物 HTML %d 个' % (len(locs), npages))
          PY

          du -sh _build

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
